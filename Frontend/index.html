<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Spoiler DollarPrinter - moneyprinterke.com</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px}
.card{background:#18181b;border:1px solid #27272a;border-radius:16px;padding:16px}
.btn{border:1px solid #333;padding:10px 14px;border-radius:10px;font-weight:900;cursor:pointer;margin:4px;font-size:12px}
.btn-on{background:#22c55e;color:#000}
.btn-off{background:#000;color:#aaa}
.buy{width:100%;background:#22c55e;color:#000;padding:14px;border-radius:10px;font-weight:900;border:0;margin-top:10px}
.sell{width:100%;background:#ef4444;color:#000;padding:14px;border-radius:10px;font-weight:900;border:0;margin-top:8px}
.log{background:#000;border:1px solid #222;border-radius:12px;padding:10px;height:200px;overflow:auto;font-family:monospace;font-size:11px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1 style="margin:0">Mr Spoiler <span style="color:#22c55e">DOLLARPRINTER</span> <span style="background:#22c55e;color:#000;font-size:10px;padding:4px 8px;border-radius:999px">LIVE</span></h1>
<p style="color:#71717a;font-size:12px;margin:4px 0 0 0">moneyprinterke.com • Kitale KE • Deriv + YouTube Engine</p>

<div id="pairs" style="margin-top:16px;display:flex;flex-wrap:wrap"></div>

<div style="margin-top:12px">
<label style="font-size:11px;color:#888">Stake ($)</label>
<input id="stake" type="number" value="1" style="width:100%;background:#000;border:1px solid #333;padding:10px;border-radius:8px;color:#fff;margin-top:4px">
</div>

<button class="buy" onclick="trade('BUY')">BULK BUY</button>
<button class="sell" onclick="trade('SELL')">BULK SELL</button>

<div id="logs" class="log"></div>
</div>

<script>
const all=["R_100","R_50","R_25","EURUSD","GBPUSD","XAUUSD","BTCUSD","Volatility 75","Volatility 100"];
let sel=["R_100"];
function render(){
 const c=document.getElementById('pairs');c.innerHTML='';
 all.forEach(p=>{
  const b=document.createElement('button');
  b.className='btn '+(sel.includes(p)?'btn-on':'btn-off');
  b.textContent=p;
  b.onclick=()=>{ sel.includes(p)? sel=sel.filter(x=>x!==p) : sel.push(p); render(); };
  c.appendChild(b);
 });
}
function trade(type){
 const stake=document.getElementById('stake').value;
 const t=new Date().toLocaleTimeString();
 const log=document.getElementById('logs');
 log.innerHTML=`<div style="color:#a1a1aa;border-bottom:1px solid #111;padding:4px 0">${t} - ${type} ${sel.length} pairs | Stake $${stake} | ${sel.join(', ')}</div>`+log.innerHTML;
}
render();
trade('READY');
</script>
</body>
</html>
